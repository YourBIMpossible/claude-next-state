      glob) triaged scope=development and fixed via npm overrides, merged 2026-07-27'
  - kind: run
    ref: 'gh api dependabot/alerts 2026-08-04: 1 open HIGH — a NEW advisory (see SEC-BRACE-2), not a regression
      of the policy scope here'
  - kind: run
    ref: 'POLICY NOW DEMONSTRATED IN THE WILD, which is exactly what the 2026-08-04 note said was still
      owed. #300 (2fcec8d) added the github-actions ecosystem to the Dependabot config on 2026-08-07,
      and Dependabot immediately opened five Action bumps -- #301 setup-python, #302 dependabot/fetch-metadata,
      #303 actions/github-script, #304 actions/setup-node, #305 actions/checkout. All five are still OPEN
      and unmerged (gh pr list, 2026-08-07 night). In the same window the npm/pip grouped bumps #306 (backend-minor-patch)
      and #307 (frontend-minor-patch) DID auto-merge to main. That is the designed split observed end
      to end: Actions wait for a human, package bumps do not. Observed from PR state, not from re-reading
      the workflow.'
  verification:
    level: verified
    by: 'DECIDED + SHIPPED 2026-08-04 (owner chose option a, ''exclude Actions from auto-merge''): dependabot-automerge.yml
      gates on steps.meta.outputs.package-ecosystem != ''github_actions'', so an Action bump always waits
      for manual review regardless of semver level; npm/pip auto-merge unchanged. Rationale recorded in
      the workflow header, not just the commit. MERGED f8b022f and pulled to the local main. No Actions
      allowlist change needed (no new uses: reference). Alerts also back at ZERO (SEC-BRACE-2 via PR#240).
      Live-ness note: the workflow only executes on a dependabot PR, so the next github_actions bump (AddIns
      #17 is one) is the first run that will demonstrate the exclusion in the wild.'
    at: 2026-08-04
