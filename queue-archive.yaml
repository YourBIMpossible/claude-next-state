      \ OF ONE SYMPTOM, both unresolved by probe -- surfaced, not picked.\n  READING A (stored, 2026-08-06,\
      \ level claimed): the local .env carries production OAuth callbacks together with SECURE_COOKIES=1,\
      \ so the local stack can never hold a session. Source is 01_BuildLog/2026-08-05__product-risk-assessment.md\
      \ read as prose; .env is a protected file and was never read.\n  READING B (PR #323, 2026-08-08,\
      \ merged): not an environment defect at all -- since AUTH-3 the OAuth CSRF state is cookie-only\
      \ (aps_oauth_state, Max-Age = _STATE_TTL), so a slow credential+MFA entry outlives the cookie, /auth/callback\
