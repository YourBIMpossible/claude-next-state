  - kind: doc
    ref: "decision-log/2026-08-05__door-origin-gap-curtain-panel.md -- full diagnostic writeup, all four ruled-out routes with machine evidence, and the owner decision"
  - kind: code
    ref: "backend/aec/geometry_fetch.py:179 fetch_equipment_origins (absent OriginComponent -> origins[ext]=None, an AFFIRMATIVE fact); backend/aec/room_geometry_warm.py:238 ensure_category_origins_warm (origins.get(uid); if origin is None: continue -- DISCARDS that fact); backend/aec/cross_model_join.py:35 RoomStatus, :152 MEP resolver, :244 doors resolver; frontend/app/lib/aec/element.ts:51 LINKED_ROOM_BLANK_REASON"
  verification:
    level: verified
    by: "PROMOTED to landed 2026-08-06 (reconcile) -- the 'AWAITING OWNER CONFIRM, nothing built' reading below is SUPERSEDED. PR#256 MERGED 2026-08-05T21:54:26Z, squash 4161a27, built exactly the plan this item specified: element_cache.origin_absent, migration b0c1d2e3f4a5, new no_origin_in_source RoomStatus, deliberately no backfill. landed not live: the migration's applied state was NOT probed (this session is barred from docker and from the production DB), so whether b0c1d2e3f4a5 is actually in the running schema is unknown. Prior reading preserved verbatim below -- its effort/owner-gate reasoning was correct and was acted on; the store simply never saw the merge. || DIAGNOSTIC COMPLETE 2026-08-05, branch (b) confirmed and the fix it assumed is DEAD. AEC DM correctly reports no origin for curtain-panel and unhosted doors -- they have no Level association and no exposed host, so there is nothing to derive from. Mechanism, all 620 mv-90 doors, zero exceptions: OriginComponent present <=> a Level reference exists (259 with both, 361 with neither, 0 either way). Partition matches the firm hosting suffixes exactly -- 249 -WH + 10 wall-hosted manufacturer families = the 259; 217 -CP + 7 -UH + 137 nested/2D components = the 361. Corroborated by cached params: Head Height/Sill Height on 100% of origin-bearing and 0% of null-origin; a curtain-wall cluster (CW HEIGHTREPORT / CW INSETPOS / CW WIDTHREPORT) only on null-origin, ~67%. Real doors, not junk -- the 197 08-DOOR-SINGLE-SWING-CP carry 197 distinct non-blank Marks. RULED OUT with evidence: (1) not _instance_filter -- dropping the instance-only clause returns 654 vs 620 and adds ZERO origins, all 197 uniqueIds are present, 0 missing externalElementId, so not a repeat of the 2026-07-15 id-space bug; (2) NO geometry fallback -- GeometryPiece.transform is identity on every piece of every door, and decoded BinaryData is family-local even for origin-bearing doors (WH control: cache origin (60.720,33.225,6.096) vs bbox centre (0.018,0.049,1.391)); (3) NO host route -- all 23-24 ReferencesComponent edges are type/parameter edges, every target resolves externalElementId null, nothing names the host wall; (4) no other component carries placement (census: Identity 620, Properties 620, References 620, AltIds 620, BodyRepresentation 494, Origin 259). OWNER DECISION 2026-08-05: do not derive; surface these as 'no location (curtain panel)' and keep them out of room-joining paths. Revit-side placement capture is FUTURE WORK, out of scope here -- see FEAT-REVIT-DOOR-PLACEMENT. IMPLEMENTATION IS NOT A STRING SWAP, which is why effort moved S->M and owner_gate is now true: the label needs a discriminator visible at join time and there is none. parameters->>'Level' is NULL on ALL 1,231 cached doors across mv 90 and mv 742 (Casework caches Level on 1,836 rows, so the blob CAN hold it -- doors just never get it). The -CP suffix cannot be the discriminator (firm-literal ban in backend/aec/**). And origin_x IS NULL today conflates 'AEC DM affirmatively has no origin' (permanent, label it) with 'the warm backfill never ran/failed a page' (transient, must still say check location) -- room_geometry_warm.py:238 collapses both. So the honest label requires persisting the affirmative-no-origin fact at warm time: new element_cache column + alembic migration (migration-reviewer gate), warm-path change, a new RoomStatus in both resolvers, a frontend label (typescript-api-reviewer gate + Refresh-Frontend.ps1), and regression tests. ~6 files, over the bim-investigate 5-file threshold. AWAITING OWNER CONFIRM on that plan -- nothing built."
    at: '2026-08-06'
