- id: WARM-ORIGIN-DOORGAP
  title: "Curtain-panel/unhosted doors have no origin: label them 'no location (curtain panel)' instead of deriving one"
  projects: [bimpossible]
  status: landed
  owner_gate: true
  unblocks: []
