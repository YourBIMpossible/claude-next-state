- id: WSR-SECSCAN-LAUNCHGUARD
  title: Run-Security-Scan.ps1 reports a stale report as a fresh one when a scanner fails to launch
  projects:
  - workspace
  status: live
  owner_gate: false
  owner: null
  unblocks: []
  blocked_by: []
  effort: S
  risk: 3
  evidence:
  - kind: doc
    ref: F:/BIMpossible-Workspace/system/Run-Security-Scan.ps1 - four sequential `& $SCANNER` calls each read $LASTEXITCODE
      with no launch verification, under a file-wide $ErrorActionPreference = Continue, inside try/finally with no catch.
      PS 5.1 does not set $LASTEXITCODE when a native command fails to LAUNCH, so the value read belongs to the previous call;
      the launch failure also kills the script before `exit 0`, so no summary.md / LATEST.md is written and the consumer silently
      reads a stale report.
  - kind: doc
    ref: 'Same defect class as the 2026-08-31 slop-audit LOW-1 already fixed in Invoke-GitleaksScan.ps1 (commits 4063ffa /
      6cd03be) - the sentinel-exit-code + explicit-status pattern there is the ready-made remedy. Flagged not fixed: outside
      the six repos and outside that audit window.'
  - kind: commit
    ref: 'FIXED by a243cad (2026-08-31, on workspace origin/main): Run-Security-Scan.ps1 rewritten (+503) with a launch sentinel
      - $global:LASTEXITCODE is seeded with $script:LaunchSentinel before every native scanner call and read back immediately
      after, so a call that never launched is detected instead of inheriting the previous call''s exit code. system/tests/test_run_security_scan.ps1
      (333 lines) added in the same commit covers the sentinel path.'
  verification:
    level: verified
    by: 'Closed 2026-08-31: a243cad read in-session (sentinel seeded at line ~209, read back at ~213, per native call), its
      test suite present, and the commit verified an ancestor of origin/main. The original defect record above is preserved
      as history.'
    at: '2026-08-31'
  live_check:
  - powershell -NoProfile -File F:/BIMpossible-Workspace/system/tests/test_run_security_scan.ps1
  source: F:/AI-Dev/slop-audit-remediation_2026-08-31.md section 4
  notes_url: F:/AI-Dev/slop-audit-remediation_2026-08-31.md
