  claim: "LANDED 2026-08-07: PR #314 squash-merged to main as 4448fcf, all required checks green, remote branch deleted. REPRODUCED first per live_check: new backend/tests/test_groups_403_ordering.py ran RED on unmodified code -- a firm-A caller PATCH/DELETEing a firm-B group id with off-list project_id received the verbatim leak 'Project 'b.00000000-dead-beef-0000-000000000403' is not in the allowlist. Add it to ALLOWED_PROJECT_IDS in .env to proceed.' -- confirming the disclosure exactly as described. Fix: mirrored F-5 -- swapped the blocks in update_group and delete_group so group.firm_id != firm_id (uniform 403 'Group not found.') runs before assert_project_allowed; resulting order auth -> firm ownership -> allowlist -> hub gate -> scope checks; P1-5 and the e5bbb04 hub-gate placement preserved and pinned (2 foreign-probe uniform-403 tests asserting project_id never appears in the detail + 2 own-group allowlist controls). backend-endpoint-reviewer gate: PASS, no follow-ups. Verify-Local-CI backend lanes green. Reviewer's one out-of-scope observation promoted to its own entry: SEC-GROUPS-VIEWS-404-EXISTENCE-ORACLE."
  owner_gate: false
  unblocks: []
  blocked_by: []
  effort: S
  risk: 2
  evidence:
  - kind: doc
    ref: "Source: named-deliverable-personal-scope-firm-gaps.md finding #5, promoted from a pointer note on SEC-VIEWS-PERSONAL-LISTING per the user's explicit instruction."
  - kind: code
    ref: "CONFIRMED this sync pass by direct read, backend/aec/groups.py: update_group (436-458) calls assert_project_allowed(group.project_id) at line 451, THEN checks group.firm_id != firm_id at line 453; delete_group (516-535) has the identical order, assert_project_allowed at 528 then the firm check at 530. backend/guard.py:34-45 assert_project_allowed's 403 detail is f\"Project '{project_id}' is not in the allowlist...\" -- it does echo the raw project_id when the check fails."
  - kind: code
    ref: "NEW THIS PASS, not in the source memory: views.py's update_view and delete_view already had this EXACT ordering bug and already fixed it, under a different, older finding tag. views.py:348 comment on update_view: 'F-5: firm ownership check moved before assert_project_allowed... the ordering was wrong -- firm guard must be first.' views.py:463-464 on delete_view: 'F-5 (same ordering fix as PATCH): firm check before project allowlist so a cross-firm probe can't use the project allowlist as a timing oracle.' Both views.py routes now check view.firm_id != firm_id BEFORE assert_project_allowed. groups.py's update_group/delete_group were apparently never brought in line with F-5 -- the two sibling files are now inconsistent with each other on a pattern the team has already named, reasoned about, and fixed once."
  verification:
    level: claimed
    by: "NEEDS REPRODUCTION (no live/test request has confirmed the actual 403 body an attacker receives), but the F-5 discovery above substantially raises confidence this is real and not merely theoretical -- the same engineering group already treated this exact ordering as worth a dedicated fix in the sibling file. Exploitability is narrow, same precondition the source note gave: the attacker needs a valid group_id belonging to a DIFFERENT firm, AND that group's project_id must currently be OUTSIDE the global ALLOWED_PROJECT_IDS allowlist for the disclosure branch to fire (if the project is allowlisted, as most active projects presumably are, assert_project_allowed passes silently and the flow reaches the firm check, which returns a generic 'Group not found' -- no leak in that path). Fix shape: mirror F-5 exactly -- swap the two blocks so `if group.firm_id != firm_id` runs first in both update_group and delete_group."
    at: '2026-08-07'
