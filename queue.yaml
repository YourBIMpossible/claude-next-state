- id: OPS-LOCAL-SIGNIN-AUTHLOOP
  title: "Local sign-in auth-loop: WORKING-AS-DESIGNED / ENVIRONMENT-CONSTRAINED -- verify signed-in UI on the tunnel, backend OAuth on staging 8001"
  projects: [bimpossible]
  status: dropped
  owner_gate: false
  unblocks: []
