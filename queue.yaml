  - kind: pr
    ref: 'BIMpossible PR#241 (2eb20c3, merged 2026-08-04) -- the floating 2026-07-26/27 run-hardening WIP committed: /data-prefix
      fix, redis compose fix, profile-drift check'
  - kind: run
    ref: '2026-08-04 probes: grep BIMPOSSIBLE_ALLOW_SYNTHETIC_SEED hits both scripts (4+3); git ls-files confirms Run-ScheduledConcurrencyAudit.ps1
      tracked; Get-ScheduledTask confirmed the Windows task was NEVER actually registered'
  - kind: pr
    ref: 'FOLLOW-ON, and it is a correctness fix rather than more hardening: BIMpossible #294 (ec9eec9, merged 2026-08-07)
      ''fix guard-check breach misclassification''. The guard check had been treating ANY non-401/403 response as an isolation
      breach, so a 300-VU spike dry run reported 28 ''breaches'' that were entirely connection drops, timeouts and 500s with
      no evidence any cross-tenant data was ever returned. Replaced with a four-way classifier (new guard_classification.py,
      unit-tested, no Locust/DB dependency): PASS (401/403 or an identity echo matching the caller''s own tenant) / AVAILABILITY_FAILURE
      (status 0 or 5xx -- a load signal, never a security finding) / CONFIRMED_BREACH (response proves protected cross-tenant
      data came back) / GUARD_POLICY_ANOMALY (non-denial that does not itself prove disclosure). locustfile.py routes non-pass
      responses into three non-overlapping report lists so nothing double-counts, all still register as Locust failures so
      load visibility is preserved, diff_baseline.py reports the categories distinctly with only confirmed breaches CRITICAL,
      and the nonzero-on-any-finding exit contract is unchanged. Commit message read directly; the classifier module itself
      was not reviewed.'
