- id: BUG-GITLEAKS-HITS-COLLAPSE
  title: 'Invoke-GitleaksScan collapses the whole findings array into one hit under PowerShell 5.1 - every multi-finding scan
    prints one System.Object[] line and HITS: 1'
  projects:
  - workspace
  status: live
  owner_gate: false
  unblocks: []
  blocked_by: []
  effort: S
  risk: 3
  evidence:
  - kind: log
    ref: 'Observed 2026-08-31 while running the helper by hand before the main push: dot-sourcing system/Invoke-GitleaksScan.ps1
      and calling Invoke-GitleaksScan -Source ''.'' returned Status=Findings RC=1 HITSCOUNT=1 while the report file it names
      holds 18 findings (RAWCOUNT=18). Format-GitleaksScanReport therefore emitted a single line reading ''POSSIBLE LEAK  System.Object[]:System.Object[]  rule=System.Object[]''.'
  - kind: code
    ref: 'Root cause is system/Invoke-GitleaksScan.ps1 line ~152: $hits = @(Get-Content -Raw -LiteralPath $ReportPath | ConvertFrom-Json).
      Windows PowerShell 5.1''s ConvertFrom-Json emits a JSON array as ONE object rather than enumerating it (PowerShell 7
      unrolls; 5.1 does not), so @() wraps an Object[] of 18 into a 1-element array. Format-GitleaksScanReport (line ~234)
      then formats $h.File / $h.StartLine / $h.RuleID off that Object[], which member-enumerates to an array and stringifies
      as System.Object[].'
  - kind: log
    ref: 'Minimal repro on this machine (PSVersion 5.1.26100.9168): parsing a two-element JSON array literal through @(...
      | ConvertFrom-Json) yields .Count = 1, and formatting a property off element 0 yields System.Object[]. Candidate fix:
      unroll explicitly, e.g. pipe the ConvertFrom-Json output through ForEach-Object { $_ } before the @() wrap. NOT FIXED
      HERE - queued per the surfaced-not-handled rule.'
  - kind: commit
    ref: 'Fixed on workspace main by 11f8896 "fix(gitleaks): preserve report cardinality and explicit scan states" (cites
      this item id; ConvertFrom-GitleaksReportContent with explicit element unwrap and array-rejecting ConvertTo-GitleaksSafeScalar)
      plus PS7 companion b998aec (-NoEnumerate so an empty [] report parses identically under pwsh). Regression tests: system/tests/test_invoke_gitleaks_scan.ps1
      cases 15 and 16 (18-finding report -> 18 hits, 18 leak lines, no System.Object[] type name), labeled with this bug id.'
  - kind: log
    ref: 'Runtime verification 2026-08-31 at HEAD: synthetic five-finding JSON report parsed via the shipped helper under
      BOTH engines - Windows PowerShell 5.1.26100.9168 HitsCount=5 LeakLines=5, PowerShell 7.6.5 HitsCount=5 LeakLines=5.
      Root cause confirmed as PS5.1 ConvertFrom-Json emitting a JSON array as one object, which @() wrapped whole and format
      strings stringified as System.Object[].'
  verification:
    level: verified
    by: 'Closed 2026-08-31: fix commits 11f8896 + b998aec are on workspace main, regression tests cases 15/16 cover the exact
      collapse, and a dual-engine synthetic repro at HEAD returns correct multi-hit cardinality (5/5 under both PS 5.1 and
      7.6.5). The original defect record above is preserved verbatim as history.'
    at: '2026-08-31'
  live_check:
  - '. F:/BIMpossible-Workspace/system/Invoke-GitleaksScan.ps1; (Invoke-GitleaksScan -Source ''F:/BIMpossible-Workspace'').Hits.Count  #
    expect the report''s true finding count (0 on a clean repo), never a collapsed 1-with-System.Object[]'
  source: '2026-08-31 push of the /next mirror: the gitleaks helper was run by hand because Push-And-Verify.ps1 could not
    run on the dirty shared tree. Same file as commits 6cd03be / 9d1472d and item DOC-GITLEAKS-INDETERMINATE-RECORD.'
