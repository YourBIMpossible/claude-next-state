    by: "WANDER, found 2026-08-06 while evaluating PR #24 on a real Windows checkout -- reproduced and measured, deliberately NOT fixed, queued per closeout rules. DEFECT 1: workspace_root() is HERE.parent.parent, so from a worktree at .claude/worktrees/<lane> the sibling path '../BIMpossible' resolves to .claude/worktrees/BIMpossible, which does not exist; required:false makes it drop with no warning. Measured cost: 760 docs indexed instead of 845, and tools/docindex/test_docindex.py goes 58/59 -- test_the_live_ledgers_are_indexed_as_canonical fails looking for the code repo's root CLAUDE.md. Setting BIMPOSSIBLE_REPO=F:\\AI-Dev\\BIMpossible restores 845 docs and 59/59, which is what proves the diagnosis. This matters because WORKFLOW.md mandates worktrees for parallel sessions, so the sanctioned workflow is the broken one. Proposed fix: strip a trailing .claude/worktrees/<lane> from the base before resolving sibling roots -- fixes every lane at once, needs no env var, and keeps the Linux container clone working. DEFECT 2: when a section exceeds chunk.max_chars its sub-chunks all inherit the whole section's line span, so three chunks of the code repo's CLAUDE.md each carry line_start 84 / line_end 132 with different token lengths (165/308/127) and the renderer re-reads the same lines for each; on the query 'how do I add a firm parameter alias' that burns results 1-3 on one visually identical chunk and pushes the purpose-built canonical HOWTO 02_Reference/HOWTO/add-a-firm-parameter.md from rank 2 down to rank 5. NEITHER defect is a tier/config issue -- both are code, which contradicts the branch author's expectation that bad ranking is almost always a tier edit."
    at: '2026-08-06'
  live_check:
  - "python tools\\docindex\\docsearch.py --stats  from a worktree -- 'by root' must list BOTH workspace and code, not workspace alone"
  source: "session 2026-08-06 evaluating PR #24 (branch claude/documentation-rag-setup-17m33i)"
