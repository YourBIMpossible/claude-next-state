  source: self-review during SEC-PDP-G1-TEXTURE-BINDING (BIMpossible#463)
  ref: 'backend/aps/proxy_router.py:_list_project_models runs two .all() queries (ModelVersion + ModelIndex) with no LIMIT,
    on every shared-texture cache miss. The consumer already caps work at MAX_SHARED_ROOT_SCAN candidates, so the rows past
    that cap are fetched and discarded. Cost only -- no authorization impact (every candidate is still re-authorized per request).
    Fix: LIMIT the queries to the scan bound, or memoize the list per (project, short TTL).'
- id: PERF-PDP-PROXY-MISS-SENTINEL-EVICTION
  title: Negative manifest memo shares the bounded ManifestCache and can evict real manifests
  projects:
  - bimpossible
  status: landed
  unblocks: []
  blocked_by: []
  effort: S
  risk: 1
  verification:
    level: verified
    by: 'IMPLEMENTED 2026-08-30 (PR#504 open, commit aa1baa4e): ManifestCache grew an independent bounded miss slice (max_miss_entries=128,
      key->monotonic-deadline; expired-first shedding then FIFO); _miss_sentinel/_miss_is_fresh deleted from sdk_proxy.py,
      call sites use put_miss/miss_is_fresh; invalidate/clear cover both slices; TTL 60s unchanged. 7 new pins in test_pdp_g1_texture_binding.py
      incl. sentinel-storm survival of a warm manifest. Verify-Local-CI green at aa1baa4e. PR#504 MERGED 2026-08-31T00:18:11Z
      -> cb5391a2 on main.'
    at: '2026-09-01'
  live_check: gh pr view 504 -R YourBIMpossible/BIMpossible --json state,mergedAt
  source: self-review during SEC-PDP-G1-TEXTURE-BINDING (BIMpossible#463)
  ref: 'aps/sdk_proxy.py writes miss sentinels into the same FIFO ManifestCache (max_entries=512) as real manifests. A project
    with a large cold tail can push enough sentinels through to evict warm manifests, so the memo that exists to REDUCE fetches
    can cause extra ones. Cost/thrash only, never an authorization change. Fix: give sentinels their own small bounded store,
    or reserve a slice of the cache for them.'
