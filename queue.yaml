  effort: S
  risk: 3
  evidence:
  - kind: doc
    ref: "01_BuildLog/2026-08-05__product-risk-assessment.md -- the local .env carries production OAuth callbacks together with SECURE_COOKIES=1; named human-only because .env is protected"
  - kind: pr
    ref: "BIMpossible #246 (9b7dfd9, Account link in the projects/files/model headers) and #249 (7de7a8a, provider-aware key service) -- both MERGED on green CI, neither has been seen in a browser"
  - kind: pr
    ref: "BIMpossible #259 (7f1c835) -- the shared AppHeader those pages now render, same exposure"
  - kind: pr
    ref: "BIMpossible #323 (57eb2e5, merged 2026-08-08) AUTH-5 -- a MERGED FIX for this exact symptom, arrived with a DIFFERENT diagnosis. backend/auth_router.py now drops prompt=login on the self-heal retry only (is_retry True -> omit prompt entirely; is_retry False -> still prompt=login, preserving AUTH-4's account-picker guarantee). Confirmed on origin/main at auth_router.py:146-183."
  verification:
    level: verified
    by: "FORMERLY CONTRADICTED (settled 2026-08-15, see resolution). Original record: TWO COMPETING DIAGNOSES OF ONE SYMPTOM, both unresolved by probe -- surfaced, not picked.\n  READING A (stored, 2026-08-06, level claimed): the local .env carries production OAuth callbacks together with SECURE_COOKIES=1, so the local stack can never hold a session. Source is 01_BuildLog/2026-08-05__product-risk-assessment.md read as prose; .env is a protected file and was never read.\n  READING B (PR #323, 2026-08-08, merged): not an environment defect at all -- since AUTH-3 the OAuth CSRF state is cookie-only (aps_oauth_state, Max-Age = _STATE_TTL), so a slow credential+MFA entry outlives the cookie, /auth/callback sees 'states held=0' and self-heals to /auth/login?retried=1; the retry then re-sent prompt=login, forcing the whole slow dance again. #323 breaks that cycle.\n  Neither reading has been settled by a probe: nobody has signed in at the local stack since #323 merged. If B is the whole cause the item is now closed by a merge; if A also holds, #323 changes nothing locally. Status stays blocked_owner because only the owner can run the one probe that decides it (live_check below), and .env stays unread.\n  Retained original assessment: STRUCTURAL VERIFICATION GAP, not a defect in any one PR. Three merged frontend changes in this delta are signed-in-only surfaces, so CI green is the ONLY evidence any of them exists visually. Reported as claimed: the .env is protected and was not read, so the exact cause is the risk assessment's reading, not a probe of mine. This is the same class of finding the Phase 15a row already records ('Stage A can never be run through the production web UI pre-merge') -- but that one was structural and unavoidable, and this one is a fixable local-environment problem. Fixing it converts every future frontend merge from 'CI says it compiles' to 'I have seen it'. unblocks empty because no stored item is gated on it; its value is a permanent raise in the evidence floor, which the cone cannot express."
    at: '2026-08-08'
    resolution: "CONTRADICTION SETTLED 2026-08-15 by direct probe of the RUNNING local backend (no .env read, no credentials): GET http://127.0.0.1:8000/auth/login redirects to Autodesk with redirect_uri=https://app.yourbimpossible.com/auth/callback -- the PRODUCTION tunnel. So the OAuth round-trip lands on prod and localhost:3000 never receives a session cookie; the 'loop' is the documented design (README.md:25 'localhost can't hold a login'; docker-compose.override.yml explicitly forbids the localhost FRONTEND_URL 'fix' because it splits the cookie origin). READING A CONFIRMED as environment-constrained-by-design, not a defect; READING B (#323) fixed a real but separate retry-loop on the tunnel path. RESOLUTION: dropped as a defect. Standing routing: signed-in FRONTEND verification = tunnel https://app.yourbimpossible.com (prod environment task); backend OAuth/tenancy verification = isolated staging backend http://localhost:8001 whose callback http://localhost:8001/auth/callback is registered on the APS app (probe-verified 2026-08-15; staging has no frontend). Local 8000 remains type-check/unit-test only, per README."
  live_check:
  - "curl -sI http://127.0.0.1:8000/auth/login | grep -i location  # redirect_uri still the prod tunnel => still working-as-designed"
  source: "01_BuildLog/2026-08-05__product-risk-assessment.md; PRs #246 / #249 / #259; PR #323 (AUTH-5); live probe of running backend 2026-08-15; README.md:25; docker/docker-compose.override.yml"
