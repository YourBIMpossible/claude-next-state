    by: 'IMPLEMENTED 2026-08-30 (PR#502 open, commit 81881b1f): both queries now carry _MAX_PROJECT_MODEL_ROWS = MAX_SHARED_ROOT_SCAN*4
      in SQL with deterministic recency-first ORDER BY (cached_at/last_seen DESC + stable tie-breaks) and a WARNING on cap
      hit; version choice stays the Python numeric sort. 5 new pins in test_pdp_g1_texture_binding_routes.py; Verify-Local-CI
      green at 81881b1f (all 3 lanes). PR#502 MERGED 2026-08-31T00:14:59Z -> 06d545b2 on main.'
