  - kind: run
    ref: "2026-08-06 Get-FileHash on %APPDATA%/Autodesk/Revit/Addins/2026/BIMpossible.RevitLink.dll -- SHA256 5268AEFA..., 2554880 bytes, mtime 2026-08-04 21:10:58. Does not match the ledger's recorded hash, and no ledger entry exists for it."
  verification:
    level: verified
    by: "WANDER, found while pre-flighting P13-T4-REFUSAL on 2026-08-06 -- not fixed, queued per closeout rules. The ledger's own standing rule 1 requires an entry per deploy; at least one deploy (2026-08-04, almost certainly the refusal-path test build) landed in the shared 2026 slot without one. That ledger is the ONLY coordination mechanism for a single %APPDATA% slot shared by every Revit version and every parallel session, so a stale ledger means the next session cannot tell what is deployed without hashing it by hand. The ledger also documents two traps worth keeping: the deployed DLL's mtime is NOT the deploy time, and computer-use open_application spawns a SECOND Revit instance rather than fronting the running one, after which both instances lock the deploy DLLs. Fix is one appended entry plus a habit, not a code change."
