    ref: "Owner scoping decision 2026-08-07: this item is UNDER-SCOPED, not stale. Required scope = (a) decide which parameters belong in the BIMP_ set; (b) add an intentional runtime entry point that invokes DeliverableParameterInstaller.EnsureInstalled; (c) add or expose an intentional runtime entry point for the read side (ConformanceDiagnosticCommand / ViewExtractor) so the GUID-backed parameter is actually consumed; (d) decide WHERE those entry points belong -- ribbon button, .addin Type=Command entry, startup IExternalApplication, or another explicit user workflow -- and test the installed-to-read path; (e) preserve GUID-first lookup and the current binding semantics unless the feature's requirements force a deliberate migration. Writer and reader activate together or not at all. ACCEPTANCE CRITERION (owner, 2026-08-07): the chosen entry point must make a missing or invalid Shared Parameter File VISIBLE AND ACTIONABLE to the user. EnsureInstalled currently returns silently at DeliverableParameterInstaller.cs:21 when spf is null, and its 'retry next setup pass' comment is not a runtime recovery strategy until an actual setup lifecycle exists -- so either build that lifecycle or surface the failure at the entry point; a silent no-op is not an acceptable outcome for this item."
